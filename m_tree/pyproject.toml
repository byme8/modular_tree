[build-system]
requires = ["scikit-build-core>=0.5", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "m_tree"
version = "5.5.2"
description = "Procedural 3D tree generation library"
requires-python = ">=3.11"

[tool.scikit-build]
wheel.packages = []
# Renamed from cmake.verbose in scikit-build-core 0.10; the old key is a hard
# error there, which breaks the wheel build for anyone on a current toolchain.
build.verbose = true
